name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Server (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Solo il server (e i test): `npm run typecheck` controllerebbe anche
      # l'app, ma qui le sue dipendenze non sono installate. L'app ha il suo
      # job qui sotto. Il passo `npm run build` non c'è più: compilava il web,
      # che è stato rimosso; il server gira direttamente con Node.
      - run: npx tsc --noEmit
      - run: npm test

  mobile:
    name: Mobile App (typecheck, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # Su ogni push a main, se i test passano, compila APK e rilascia su TestFlight
  deploy-mobile:
    name: Deploy Mobile (TestFlight & Android APK)
    needs: [server, mobile]
    # Momentaneamente disattivato per non consumare crediti EAS Cloud.
    # Per riattivare, ripristinare: if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false
    uses: ./.github/workflows/deploy-mobile.yml
    secrets: inherit
